# Rust workspace for Night Drop's security core and the minimal relay server.
# The Flutter app lives in app/ and is built separately with the Flutter toolchain.
[workspace]
resolver = "2"
members = ["core", "relay", "webtunnel"]
# Patched dependency, built through [patch.crates-io] below, not a workspace member.
exclude = ["third_party/saturating-time"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
# Bumped 1.75 -> 1.85 for the hybrid PQ pairing (§4.1): the vetted `ml-kem` (FIPS 203) crate
# requires 1.85. No active users, so raising the toolchain floor is acceptable.
rust-version = "1.85"

# Build the security-critical core with overflow checks even in release.
[profile.release]
overflow-checks = true

# saturating-time 0.3.0 loops forever on Windows, which hangs Tor over bridges (arti#2726).
# See third_party/saturating-time/NIGHTDROP-PATCH.md; remove once arti ships the fix.
[patch.crates-io]
saturating-time = { path = "third_party/saturating-time" }
