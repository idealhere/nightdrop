name: Preview Android APK (HTTPS-first)

# Builds an installable arm64 debug APK for looking at the app on a real phone before the
# relay deployment is finished. It runs only when this file changes (or manually), so it does
# not add a second Android build to every push. The APK is debug-signed with the runner's
# throwaway key: installing a later build over it requires uninstalling first.
# Edit the line below to request a fresh build: preview 28
on:
  push:
    branches: [feature/https-primary-transport]
    paths: [.github/workflows/preview-apk.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-apk
  cancel-in-progress: true

env:
  # The planned primary relay. The app starts and shows its UI without it; pairing and
  # messaging need the relay to be live.
  HTTPS_RELAY: https://relay.dforadar.ru/v1/relay

jobs:
  android:
    name: arm64 debug APK
    runs-on: ubuntu-latest
    # The preview release below is the only thing in this repository's workflows that publishes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: app/.fvmrc

      - name: Sync generated config
        run: make config

      - name: Resolve Dart dependencies
        run: cd app && flutter pub get && flutter gen-l10n

      # Same shape as the CI Android step (WebTunnel off): no onion endpoint is baked yet, so
      # there is no Tor fallback to compile in. The run number is the build number, so every
      # published APK is distinguishable both by file name and inside the app.
      - name: Build APK
        env:
          NIGHTDROP_WEBTUNNEL: "0"
          # Build-time app identity (MAINTENANCE.md §7). A distinct id installs alongside an
          # upstream Night Drop instead of colliding with it.
          ORG_GRADLE_PROJECT_appId: app.nightdog
          ORG_GRADLE_PROJECT_appName: "CyberDog"
        run: |
          set -euo pipefail
          cd app
          flutter build apk --debug --split-per-abi --target-platform android-arm64 "--build-number=$GITHUB_RUN_NUMBER" "--dart-define=CYBERDOG_BUILD=$GITHUB_RUN_NUMBER" "--dart-define=NIGHTDROP_HTTPS_RELAY=$HTTPS_RELAY"

      - name: Verify Rust core is bundled
        run: |
          set -euo pipefail
          APK=app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libnightdrop.so'

      # One prerelease tag, but the file name carries the version and build number so builds are
      # never confused with each other: nightdog-<version>-b<build>.apk.
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *//p' app/pubspec.yaml | cut -d+ -f1)"
          name="cyberdog-${version}-b${GITHUB_RUN_NUMBER}.apk"
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk "$name"
          gh release delete preview-apk --yes --cleanup-tag || true
          # The tag is removed asynchronously; creating the release again can race with that.
          for attempt in 1 2 3 4; do
            if gh release create preview-apk "$name" --prerelease --target "$GITHUB_SHA" --title "CyberDog ${version} build ${GITHUB_RUN_NUMBER} (preview, debug)" --notes "Debug-signed test build. Not a production release."; then
              exit 0
            fi
            echo "publish attempt $attempt failed"
            sleep 8
          done
          exit 1
